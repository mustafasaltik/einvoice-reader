{% extends "base.html" %}

{% block title %}{{ trans.index_title }} — {{ trans.site_name }}{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold text-gray-900 mb-2">{{ trans.index_title }}</h1>
<p class="text-gray-500 mb-8">{{ trans.index_subtitle }}</p>

{% if error %}
<div class="mb-6 rounded-md bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-700">
  {{ error }}
</div>
{% endif %}

<form method="post" action="/analyse" enctype="multipart/form-data" class="space-y-6">

  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">{{ trans.index_upload_label }}</label>
    <input type="file" name="file" accept=".xml,.pdf"
      class="block w-full text-sm text-gray-700 file:mr-4 file:py-2 file:px-4
             file:rounded file:border-0 file:text-sm file:font-medium
             file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" />
  </div>

  <div class="relative">
    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-200"></div></div>
    <div class="relative flex justify-center"><span class="bg-gray-50 px-2 text-xs text-gray-400">{{ trans.index_or }}</span></div>
  </div>

  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">{{ trans.index_paste_label }}</label>
    <textarea name="paste" rows="6" placeholder="<?xml version=&quot;1.0&quot; ...?>"
      class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm font-mono
             focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
  </div>

  <button type="submit"
    class="w-full rounded-md bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white
           hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
    {{ trans.index_submit }}
  </button>

</form>
{% endblock %}
