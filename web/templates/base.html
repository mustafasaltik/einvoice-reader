<!doctype html>
<html lang="{{ locale }}" class="h-full bg-gray-50">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}{{ trans.site_name }}{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12" integrity="sha384-ujb1lZYygJmzgSwoxRggbCHcjc0rB2uH8H7WFAfQP8C6OkDIaqn7dpK8Oo08GqP" crossorigin="anonymous"></script>
</head>
<body class="h-full">
  <header class="bg-white border-b border-gray-200">
    <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="/" class="text-lg font-semibold text-gray-900">{{ trans.site_name }}</a>
      <div class="flex items-center gap-4">
        <a href="/rules" class="text-sm text-gray-500 hover:text-gray-700">{{ trans.nav_rules }}</a>
        <span class="text-gray-200">|</span>
        <a href="{{ request.url.path }}?lang=en"
           class="text-sm {% if locale == 'en' %}font-semibold text-gray-900{% else %}text-gray-400 hover:text-gray-700{% endif %}">EN</a>
        <a href="{{ request.url.path }}?lang=de"
           class="text-sm {% if locale == 'de' %}font-semibold text-gray-900{% else %}text-gray-400 hover:text-gray-700{% endif %}">DE</a>
      </div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-10">
    {% block content %}{% endblock %}
  </main>

  <footer class="mt-16 border-t border-gray-200 py-6 text-center text-xs text-gray-400">
    {{ trans.footer_privacy }} &nbsp;|&nbsp;
    <a href="/rules" class="underline">{{ trans.footer_rules }}</a>
  </footer>
</body>
</html>
